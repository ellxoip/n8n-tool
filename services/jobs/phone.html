<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trabajos de programación</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#10151e;color:#e8eef8}body{max-width:850px;margin:auto;padding:22px}a{color:#abc7ff}input,textarea,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #40516b;background:#19263b;color:white;box-sizing:border-box}input,textarea{width:100%;margin:8px 0}button{cursor:pointer;margin:8px 8px 8px 0;background:#315aca}article{padding:20px;margin:20px 0;background:#172230;border-radius:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.86rem}p{line-height:1.5}.status{color:#9abaff}button:disabled{opacity:.5}</style>
<h1>Trabajos de programación</h1><p>Prepara una tarea, revisa la propuesta y autoriza su ejecución. El agente trabaja dentro del workspace local; al terminar puedes revisar el diff y aceptar el resultado.</p>
<p><a href="/terminal/">Abrir terminal del notebook</a> · <a href="/webhook/voz">Conversar por voz</a> · <a href="/webhook/agente-supervisor/chat">Equipo de agentes</a></p>
<form id="form"><label>Proyecto (carpeta dentro de workspace)<input id="workspace" placeholder="mi-proyecto" required></label><label>Tarea<textarea id="task" rows="5" required placeholder="Describe el cambio y cómo comprobarlo"></textarea></label><label>Verificación <select id="test"><option value="">Sin comando adicional</option><option>npm test</option><option>npm run lint</option><option>pytest -q</option><option>go test ./...</option><option>cargo test</option></select></label><br><button>Preparar trabajo</button></form><p id="message" role="status"></p><section id="jobs"></section>
<script>
const $=id=>document.getElementById(id);const labels={pending_approval:'Esperando tu autorización',queued:'En cola',running:'En ejecución',awaiting_review:'Resultado listo para revisar',completed:'Aceptado',changes_requested:'Requiere cambios',rejected:'Rechazado',failed:'Falló',interrupted:'Interrumpido'};
async function call(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw new Error(x.error||'No se pudo completar la acción');return x}
function text(parent,tag,value){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e}
function button(parent,label,id,action){const b=text(parent,'button',label);b.onclick=async()=>{b.disabled=true;try{await call(`/jobs/${id}/${action}`,{});await refresh()}catch(e){$('message').textContent=e.message;b.disabled=false}}}
async function refresh(){try{const data=await call('/jobs');$('jobs').replaceChildren();for(const j of data.jobs.slice(0,30)){const a=document.createElement('article');text(a,'h2',j.request.workspace);text(a,'p',labels[j.status]||j.status).className='status';text(a,'p',j.request.task);text(a,'p',j.request.test?`Verificación: ${j.request.test}`:'Sin comando de prueba adicional');if(j.status==='pending_approval'){button(a,'Autorizar y ejecutar',j.id,'approve');button(a,'Rechazar',j.id,'reject')}if(j.status==='awaiting_review'){button(a,'Aceptar resultado',j.id,'accept');button(a,'Pedir cambios',j.id,'changes')}if(j.startedAt&&j.status==='running')text(a,'p',`Tiempo: ${Math.round((Date.now()-Date.parse(j.startedAt))/1000)} s`);const output=j.result?.output||j.progress||j.error;if(output){const d=document.createElement('details');text(d,'summary','Ver avance y salida');text(d,'pre',output);a.append(d)}if(j.result?.changes){const d=document.createElement('details');text(d,'summary','Revisar archivos y diff');text(d,'pre',[j.result.changes.status,j.result.changes.stat,j.result.changes.diff].filter(Boolean).join('\n'));a.append(d)}if(j.result?.tests)text(a,'pre',JSON.stringify(j.result.tests,null,2));$('jobs').append(a)}}catch(e){$('message').textContent=e.message}}
$('form').onsubmit=async e=>{e.preventDefault();try{await call('/jobs',{workspace:$('workspace').value.trim(),task:$('task').value.trim(),test:$('test').value});$('message').textContent='Trabajo preparado. Revisa y pulsa Autorizar y ejecutar.';$('task').value='';await refresh()}catch(e){$('message').textContent=e.message}};
refresh();setInterval(()=>{if(!document.hidden&&!document.querySelector('details[open]'))refresh()},3000);
</script></html>
